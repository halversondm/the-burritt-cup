name: Test, Build and Publish to S3

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install Dependencies
        run: npm install
      - name: Check Formatting
        if: ${{ success() }}
        run: npm run prettier:check
      - name: Lint Code
        if: ${{ success() }}
        run: npm run lint
      - name: Test Code
        if: ${{ success() }}
        run: npm run test -- --run --coverage --coverage.reporter=lcov --coverage.include='src/**'
      - name: SonarCloud Scan
        if: ${{ success() && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.4.1
      - name: Build Code
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: npm run build
      - name: Deploy to S3
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: reggionick/s3-deploy@v4.0.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          bucket: ${{ secrets.AWS_BUCKET }}
          bucket-region: ${{ secrets.S3_BUCKET_REGION }}
          folder: "dist"
          dist-id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          delete-removed: true
